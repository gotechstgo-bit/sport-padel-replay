
name: Gerar APK Sport Padel

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositÃ³rio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q android-project.zip -d android-build

      - name: Compilar APK de teste
        working-directory: android-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SportPadel-Camera-Teste
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
